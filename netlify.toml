# Block archive folder from public access
[[redirects]]
  from = "/_archive/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200


# Clean URL support
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Limit referrer data sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=()"
    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Prevent cross-origin popup attacks
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Content Security Policy
    # unsafe-inline required for Facebook Pixel + Clarity inline loaders
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://*.facebook.com https://www.lexoniagroup.com https://*.clarity.ms; connect-src 'self' https://connect.facebook.net https://*.facebook.com https://*.clarity.ms; frame-ancestors 'none';"
