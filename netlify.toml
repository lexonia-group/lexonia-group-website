# lexoniagroup.com — Netlify configuration
# Deploys from GitHub lexonia-group/lexonia-group-website, branch main. No build step: static files at the repo root.
# Every change is QA-gated by .github/workflows/qa.yml (Agency Playbook SOP 02) before it can merge.

[build]
  publish = "."

# ── Facebook crawler files (Agency Playbook LP SOP Phase 7) ─────────────────
# Netlify strips dotfolders, so the ucp file lives at the root and /.well-known/ucp is served from it.
[[redirects]]
  from = "/.well-known/ucp"
  to = "/ucp"
  status = 200

[[headers]]
  for = "/ucp"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/ucp"
  [headers.values]
    Content-Type = "application/json"

# ── Archive folder is never public ──────────────────────────────────────────
[[redirects]]
  from = "/_archive/*"
  to = "/404.html"
  status = 404

# ── Clean URLs ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200

# ── Security headers (every response) ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Limit referrer data sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=()"
    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Prevent cross-origin popup attacks
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Content Security Policy.
    # 'unsafe-inline' in script-src is required by the Meta Pixel and Clarity inline loaders.
    # Wildcards for clarity.ms and facebook.com are required (Playbook: Clarity was silently blocked for 10 days without them).
    # frame-src 'none': the site embeds nothing (Calendly opens in a new tab). object-src 'none', base-uri 'self', form-action 'self' close the remaining injection routes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://*.facebook.com https://lexoniagroup.com https://www.lexoniagroup.com https://*.clarity.ms; connect-src 'self' https://connect.facebook.net https://*.facebook.com https://*.clarity.ms; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# ── Caching: assets are not fingerprinted, so keep shared caches short; HTML stays revalidated ──
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
